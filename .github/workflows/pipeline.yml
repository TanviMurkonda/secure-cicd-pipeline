# Secure Pipeline — think "airport security for code".
# Each job is one checkpoint. "needs:" chains them in order, so if one
# checkpoint fails, every checkpoint after it is skipped and nothing ships.

name: Secure Pipeline

on:
  push:              # every push to any branch
  pull_request:      # every pull request
  schedule:
    # Every Monday at 13:00 UTC. New CVEs get published all the time, so code
    # that passed last week can fail this week WITHOUT any change from you.
    # The weekly run catches that "drift".
    - cron: "0 13 * * 1"
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

# Least privilege: by default every job's token can only READ the repo.
# Only the final job is granted the one extra permission it needs.
permissions:
  contents: read

env:
  # Registry image names must be lowercase, so this is spelled out
  # instead of using the (mixed-case) GitHub username.
  IMAGE: ghcr.io/tanvimurkonda/secure-cicd-pipeline

jobs:
  # ---------- GATE 1: committed secrets ----------
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full git history: a key committed then "deleted" later
          # is still in history, so a shallow checkout would miss it.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- GATE 2: insecure code patterns (SAST) ----------
  sast:
    needs: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      # -ll = fail only on MEDIUM or HIGH severity. Exit code 1 fails the job.
      - run: bandit -r app -ll

  # ---------- GATE 3: vulnerable dependencies ----------
  dependency-scan:
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # Trust the exit code, never grep the output for words like "CRITICAL".
      - run: pip-audit -r requirements.txt

  # ---------- GATE 4: misconfiguration (Dockerfile + this workflow) ----------
  config-scan:
    needs: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install checkov
      # Checkov reads config files and checks them against security rules,
      # e.g. "container runs as root", "no HEALTHCHECK", "workflow token has
      # write-all permissions". Any failed check -> exit code 1 -> job fails.
      - run: checkov -d . --framework dockerfile github_actions --compact

  # ---------- GATE 5 (image scan) + GATE 6 (publish) ----------
  # These are ONE job on purpose: the exact image Trivy scans is the exact
  # image that gets pushed. If they were separate jobs, the second job would
  # rebuild, and you'd be shipping an image that was never scanned.
  build-scan-push:
    needs: config-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # the ONLY job allowed to write to the registry
      # Lets this job ask GitHub for a short-lived identity token (OIDC).
      # Cosign trades that token for a signing certificate that says
      # "this was signed by pipeline.yml in TanviMurkonda/secure-cicd-pipeline".
      # It does NOT grant any extra access to the repo.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Tag with the commit SHA, so every image traces back to exact code.
      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      # GATE 5: scan the built image (OS packages + Python libraries inside it).
      # Pinned to an exact version, never @master: in 2026 this action's
      # tags were hit by a supply-chain attack, so "whatever is newest"
      # is not a safe thing to run in a security pipeline.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          # Only fail on vulnerabilities that HAVE a fix available.
          # Unfixed base-image CVEs would otherwise block every build
          # with nothing you can do about it. (Trade-off: note it in NOTES.md.)
          ignore-unfixed: true
          exit-code: "1"

      # GATE 6: publish, but only from a push to main.
      # Test branches, PRs, and the weekly scan run every gate but never ship.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # GITHUB_TOKEN is short-lived (expires when the job ends) and is
        # created fresh per run. No password or long-lived key stored anywhere.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE:${{ github.sha }}"

      # ---------- SUPPLY CHAIN: SBOM + signature ----------
      # Analogy: the SBOM is the ingredients label, the signature is the
      # tamper-evident seal with the factory's name stamped on it.

      # Tags like ":abc123" can be moved to point at a different image.
      # A digest ("@sha256:...") is a fingerprint of the exact bytes, so it
      # can never change. We sign and verify the digest, never a tag.
      - name: Get image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")
          echo "Pushed image: $REF"
          echo "IMAGE_REF=$REF" >> "$GITHUB_ENV"

      # SBOM = Software Bill of Materials: a machine-readable list of every
      # package inside the image, with versions. When the next big CVE drops,
      # anyone can check "is that package in this image?" in seconds.
      # CycloneDX is a standard SBOM format. Trivy can generate it too,
      # so we don't need to trust yet another third-party action.
      - name: Generate SBOM (CycloneDX)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # The local copy we just built and pushed: same bytes as IMAGE_REF.
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v4.1.2

      # "Keyless" signing: there is no private key file to store or leak.
      # Cosign uses the OIDC token above to get a certificate valid for
      # ~10 minutes, signs with it, and records the signature in Rekor,
      # a public append-only log, so it can't be quietly removed later.
      # --yes skips the "are you sure?" prompt (no human in CI to answer it).
      - name: Sign image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cosign sign --yes "$IMAGE_REF"

      # Attach the SBOM to the image as a SIGNED attestation, so the
      # ingredients list itself is tamper-evident and travels with the image.
      - name: Attest SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE_REF"

      # Prove it worked, inside the pipeline itself. Verification checks
      # WHO signed it: only this exact workflow file, on this branch, in
      # this repo, via GitHub's identity provider. A signature from anyone
      # else (even another repo of yours) fails this check.
      - name: Verify signature and SBOM attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IDENTITY="https://github.com/${{ github.workflow_ref }}"
          ISSUER="https://token.actions.githubusercontent.com"
          cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "$IMAGE_REF" > /dev/null
          cosign verify-attestation --type cyclonedx \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "$IMAGE_REF" > /dev/null
          echo "Signature and SBOM attestation verified for $IMAGE_REF"

      # Also save the SBOM as a downloadable file on the run's Summary page,
      # so you can open it and see exactly what's inside your image.
      - name: Upload SBOM artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
